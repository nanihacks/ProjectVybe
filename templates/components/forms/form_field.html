<div class="form-field{% if field.errors %} form-field--error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<p id="{{ field.auto_id }}_help" class="form-help">{{ field.help_text }}</p>{% endif %}
    {% if field.errors %}
        <div id="{{ field.auto_id }}_error" role="alert">
            {% for error in field.errors %}<p class="form-error">{{ error }}</p>{% endfor %}
        </div>
    {% endif %}
</div>
