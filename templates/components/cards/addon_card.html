{% load pricing %}<article class="card card--addon">
    <div class="card__body">
        <h3 class="card__title">{{ addon.name }}{% if addon.is_popular %} <span class="badge">Popular</span>{% endif %}</h3>
        <p class="card__summary">{% firstof addon.benefit addon.description "Ask about this project add-on through an enquiry." %}</p>
        {% if included %}
            <p class="price"><strong class="price__now">Included</strong></p>
        {% elif amount is not None %}
            <p class="price"><strong class="price__now">+{{ amount|inr }}</strong></p>
        {% endif %}
    </div>
</article>
